services:
  transaction-postgres:
    image: postgres:15
    container_name: transaction-postgres
    environment:
      POSTGRES_DB: ${DOCKER_TRANSACTION_DB_NAME}
      POSTGRES_USER: ${DOCKER_TRANSACTION_DB_USERNAME}
      POSTGRES_PASSWORD: ${DOCKER_TRANSACTION_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - transaction_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOCKER_TRANSACTION_DB_USERNAME} -d ${DOCKER_TRANSACTION_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  auth-postgres:
    image: postgres:15
    container_name: auth-postgres
    environment:
      POSTGRES_DB: ${DOCKER_AUTH_DB_NAME}
      POSTGRES_USER: ${DOCKER_AUTH_DB_USERNAME}
      POSTGRES_PASSWORD: ${DOCKER_AUTH_DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOCKER_AUTH_DB_USERNAME} -d ${DOCKER_AUTH_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s  
    restart: on-failure
  
  gateway-server:
    build: ./gateway-service
    container_name: gateway-server
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${DOCKER_EUREKA_URL}
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: on-failure
  
  transaction-server:
    build: ./transaction-service
    container_name: transaction-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_USERNAME: ${DOCKER_TRANSACTION_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DOCKER_TRANSACTION_DB_PASSWORD}
      SPRING_DATASOURCE_URL: ${DOCKER_TRANSACTION_DB_URL}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_SECRET_KEY: ${DOCKER_JWT_SECRET}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${DOCKER_EUREKA_URL}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      eureka-server:
        condition: service_healthy
      transaction-postgres:
        condition: service_healthy
    restart: on-failure

  auth-server:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_USERNAME: ${DOCKER_AUTH_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DOCKER_AUTH_DB_PASSWORD}
      SPRING_DATASOURCE_URL: ${DOCKER_AUTH_DB_URL}
      SPRING_JWT_SECRET: ${DOCKER_JWT_SECRET}
      SPRING_JWT_LIFETIME: ${DOCKER_JWT_LIFETIME}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${DOCKER_EUREKA_URL}
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-postgres:
        condition: service_healthy
    restart: on-failure    

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,LOCAL:PLAINTEXT'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,LOCAL://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,LOCAL://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  auth_postgres_data:
  transaction_postgres_data: